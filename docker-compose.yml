name: tikootak

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, DAC_OVERRIDE, CHOWN, FOWNER]   # Caddy فایل‌های گواهی در data/caddy را می‌خواند/می‌نویسد؛ بدون این‌ها permission denied می‌دهد
    pids_limit: 200
    restart: unless-stopped
    logging: *logging
    mem_limit: ${CADDY_MEM:-64m}
    ports:
      - "${HTTP_BIND:-80}:80"      # behind haproxy: HTTP_BIND/HTTPS_BIND=127.0.0.1:PORT (see scripts/haproxy.sh)
      - "${HTTPS_BIND:-443}:443"
    volumes:
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./web/dist:/srv/web:ro
      - ./certs:/certs:ro
      - ./data/caddy:/data
      - ./config/caddy-extra:/etc/caddy/extra:ro   # optional *.caddy snippets (haproxy mode writes proxy-protocol.caddy here)
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    depends_on:
      - synapse
      - gateway
      - livekit

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    restart: unless-stopped
    logging: *logging
    mem_limit: ${POSTGRES_MEM:-300m}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30", "-c", "work_mem=4MB", "-c", "effective_cache_size=512MB"]
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 5s
      timeout: 5s
      retries: 10

  synapse:
    image: ${SYNAPSE_IMAGE:-matrixdotorg/synapse:latest}
    security_opt: ["no-new-privileges:true"]
    pids_limit: 300
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8008/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: unless-stopped
    logging: *logging
    mem_limit: ${SYNAPSE_MEM:-700m}
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - ./data/synapse:/data
    depends_on:
      postgres:
        condition: service_healthy

  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:latest}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 200
    restart: unless-stopped
    logging: *logging
    mem_limit: ${LIVEKIT_MEM:-200m}
    command: --config /etc/livekit.yaml
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"     # WebRTC روی TCP (fallback)
      - "7882:7882/udp"     # WebRTC روی UDP (مسیر اصلی)
      - "3478:3478/udp"     # TURN داخلی LiveKit
      - "30000-30100:30000-30100/udp"   # relay مربوط به TURN (برای کاربران پشت NAT سخت)

  gateway:
    image: ${GATEWAY_IMAGE:-tikootak-gateway:local}
    build:
      context: ./gateway
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 150
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *logging
    mem_limit: ${GATEWAY_MEM:-450m}
    environment:
      PORT: 3000
      DB_PATH: /data/gateway.db
      SYNAPSE_URL: http://synapse:8008
      SYNAPSE_SHARED_SECRET: ${SYNAPSE_SHARED_SECRET}
      MATRIX_SERVER_NAME: ${DOMAIN}
      LIVEKIT_KEY: ${LIVEKIT_KEY}
      LIVEKIT_SECRET: ${LIVEKIT_SECRET}
      LIVEKIT_PUBLIC_URL: wss://${DOMAIN}/livekit
      GATEWAY_ADMIN_KEY: ${GATEWAY_ADMIN_KEY}
      RATE_REGISTER_PER_HOUR: ${RATE_REGISTER_PER_HOUR:-10}
      ADMIN_ALLOW_IPS: ${ADMIN_ALLOW_IPS:-}
      RATE_LOGIN_PER_15MIN: ${RATE_LOGIN_PER_15MIN:-30}
      FEED_MAX_MB: ${FEED_MAX_MB:-150}
      MUSIC_MAX_MB: ${MUSIC_MAX_MB:-60}
      STORY_MAX_MB: ${STORY_MAX_MB:-50}
      USER_QUOTA_MB: ${USER_QUOTA_MB:-3000}
      CHANNEL_PRIVACY: ${CHANNEL_PRIVACY:-1}
      TRANSCODE: ${TRANSCODE:-1}
      TRANSCODE_SKIP_MB: ${TRANSCODE_SKIP_MB:-10}
    volumes:
      - ./data/gateway:/data
    depends_on:
      - synapse
