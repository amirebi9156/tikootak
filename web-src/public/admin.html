<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>TIKOOTAK · مدیریت</title>
<style>
:root{--bg:#09090c;--s1:#111116;--s2:#18181f;--s3:#20202a;--line:#262630;--line2:#363643;--ink:#f6f6f8;--mut:#a2a2ac;--dim:#71717d;--red:#ff6b78;--amber:#f5b74a;--ok:#5ad19a;--blue:#6aa8ff;--on:#08080a}
:root[data-theme=light]{--bg:#f4f4f7;--s1:#fff;--s2:#f1f1f5;--s3:#e7e7ee;--line:#e2e2e9;--line2:#cfcfd9;--ink:#0b0b0f;--mut:#5c5c66;--dim:#8b8b96;--red:#d6303f;--amber:#b7791f;--ok:#12805c;--blue:#2b6cd4;--on:#fff}
*{box-sizing:border-box}
html{color-scheme:dark light}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.6 Vazirmatn,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:7px 13px;transition:.15s}
button:hover{border-color:var(--dim);background:var(--s3)}
button:disabled{opacity:.5;cursor:default}
button.pri{background:var(--ink);color:var(--on);border-color:var(--ink);font-weight:600}
button.red{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
button.red.solid{background:var(--red);color:#fff;border-color:var(--red);font-weight:600}
button.sm{padding:3px 9px;font-size:12.5px;border-radius:8px}
input,select,textarea{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:7px 11px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--ink) 35%,transparent);outline-offset:1px}
input[type=checkbox]{accent-color:var(--ink);width:16px;height:16px;padding:0}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;font-size:17px;letter-spacing:.02em}
.sp{flex:1}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:1180px;margin:auto;padding:0 12px 8px;scrollbar-width:none}
.tabs button{border:0;background:transparent;color:var(--mut);padding:6px 12px;border-radius:999px;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--on);font-weight:600}
.tabs .n{background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-inline-start:4px}
main{max-width:1180px;margin:auto;padding:16px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
.card h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{color:var(--mut);font-size:12.5px}
.stat small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
.cols{display:grid;gap:14px;grid-template-columns:1.4fr 1fr}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut)}.dim{color:var(--dim);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;border:1px solid var(--line2)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.pill.off{color:var(--red);border-color:color-mix(in srgb,var(--red) 55%,var(--line));background:color-mix(in srgb,var(--red) 10%,transparent)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.tag{display:inline-block;border:1px solid var(--line2);border-radius:6px;padding:0 6px;font-size:11.5px;margin-inline-end:4px;color:var(--mut)}
.tag.hot{border-color:var(--red);color:var(--red)}.tag.warn{border-color:var(--amber);color:var(--amber)}.tag.ok{border-color:var(--ok);color:var(--ok)}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 14px;margin-bottom:8px;border:1px solid var(--line2);background:var(--s1)}
.alert.crit{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--s1))}
.alert.warn{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 9%,var(--s1))}
.meter{height:8px;border-radius:99px;background:var(--s3);overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.meter.warn i{background:var(--amber)}.meter.crit i{background:var(--red)}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--s3)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--mut)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:5px}
.spark{display:flex;align-items:flex-end;gap:5px;height:90px}
.spark div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
.spark i{display:block;width:100%;background:var(--ink);border-radius:5px 5px 2px 2px;min-height:3px}
.spark small{font-size:10.5px;color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12.5px;position:sticky;top:0;background:var(--s1)}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--s2)}
.scroll{overflow:auto;max-height:70vh}
bdi{unicode-bidi:isolate}
.u{font-weight:600}
.pgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.post{position:relative;background:var(--s1);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.post.sel{outline:2px solid var(--red)}
.post .m{aspect-ratio:3/4;background:#000;display:block;width:100%;object-fit:cover;cursor:zoom-in}
.post .pv{position:absolute;top:6px;inset-inline-start:6px;display:flex;gap:4px;flex-wrap:wrap}
.post .pv .tag{background:rgba(0,0,0,.65);color:#fff;border-color:transparent}
.post .pv .tag.hot{background:var(--red)}
.post .ck{position:absolute;top:6px;inset-inline-end:6px}
.post .b{padding:8px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.post .cap{max-height:3.2em;overflow:hidden;color:var(--mut)}
.post .acts{display:flex;gap:6px}
.post .acts button{flex:1;padding:4px 6px;font-size:12px}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;justify-content:flex-end}
.sheet .p{background:var(--bg);width:min(560px,100%);height:100%;overflow:auto;padding:16px;border-inline-start:1px solid var(--line)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:16px}
.modal .p{background:var(--s1);border:1px solid var(--line2);border-radius:18px;padding:18px;max-width:440px;width:100%}
.modal h3{margin:0 0 8px}
.light{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:12px;cursor:zoom-out}
.light img,.light video{max-width:96vw;max-height:92vh;border-radius:10px;background:#000}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chain .arrow{color:var(--dim)}
.chip{border:1px solid var(--line2);border-radius:999px;padding:2px 10px;font-size:13px;background:var(--s2);cursor:pointer}
.chip.me{background:var(--ink);color:var(--on);cursor:default}
.tree ul{list-style:none;margin:0;padding:0;padding-inline-start:18px;border-inline-start:1px dashed var(--line2)}
.tree>ul{border:0;padding:0}
.tree li{margin:4px 0}
.tree .n{display:inline-flex;gap:6px;align-items:center;padding:3px 8px;border-radius:8px;cursor:pointer}
.tree .n:hover{background:var(--s2)}
.tree .tg{width:18px;text-align:center;color:var(--dim);cursor:pointer;user-select:none}
.toast{position:fixed;bottom:18px;inset-inline:0;margin:auto;width:max-content;max-width:92vw;background:var(--ink);color:var(--on);padding:9px 16px;border-radius:12px;z-index:90;font-weight:600}
.login{max-width:420px;margin:12vh auto;padding:0 16px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12.5px;color:var(--mut)}
img,video{max-width:100%}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="card">
    <div class="brand" style="margin-bottom:6px">TIKOOTAK · پنل مدیریت</div>
    <p class="mut" style="margin-top:0">کلید ادمین (GATEWAY_ADMIN_KEY در فایل .env سرور). فقط در همین تب نگه‌داری می‌شود.</p>
    <div class="row"><input id="key" type="password" placeholder="کلید ادمین" autocomplete="off" dir="ltr" style="flex:1"><button id="go" class="pri">ورود</button></div>
    <p id="lerr" class="dim"></p>
  </div>
</div>
<div id="app" hidden>
  <header>
    <div class="bar">
      <span class="brand">TIKOOTAK · مدیریت</span>
      <span id="regpill"></span>
      <span class="sp"></span>
      <button id="theme" class="sm" title="تم">تم</button>
      <button id="reload" class="sm">بازخوانی</button>
      <button id="out" class="sm">خروج</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="view"></main>
</div>
<script src="./admin.js"></script>
</body>
</html>
