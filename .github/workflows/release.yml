name: Release
# Push a tag like v0.42.0 -> builds the UI and publishes tikootak-0.42.0.tar.gz (+ .sha256) as a GitHub Release.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web-src/package-lock.json }
      - name: Build web
        working-directory: web-src
        run: npm ci --no-audit --no-fund && npx vite build
      - name: Package
        run: |
          VER="${GITHUB_REF_NAME#v}"
          chmod +x scripts/*.sh install.sh || true
          mkdir -p /tmp/out
          tar czf "/tmp/out/tikootak-$VER.tar.gz" \
            --exclude=.git --exclude=.github --exclude=node_modules --exclude='*.db' \
            --exclude=./config --exclude=./.env --exclude=./data --exclude=./backups --exclude=./certs \
            --exclude=./gateway/bin --exclude=./web-src/node_modules \
            --transform 's,^\./,tikootak/,' .
          (cd /tmp/out && sha256sum "tikootak-$VER.tar.gz" > "tikootak-$VER.tar.gz.sha256")
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          VER="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" /tmp/out/tikootak-$VER.tar.gz /tmp/out/tikootak-$VER.tar.gz.sha256 \
            --title "TIKOOTAK $VER" --notes "$(sed -n "/^## $VER\$/,/^## /p" CHANGELOG.md | sed '1d;$d')"
